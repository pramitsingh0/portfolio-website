<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pramit Singh — Full-Stack Developer</title>
    <meta
      name="description"
      content="Full-Stack Developer in Bangalore building production systems end to end — React and TypeScript on the front, Node.js and event-driven services on Google Cloud behind them."

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
    />
    <script>
      // Runs before paint so the theme never flashes.
      try {
        var t =
          localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
